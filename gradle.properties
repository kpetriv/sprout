# Gradle daemon
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# KSP2 incremental state has survived deleted outputs and reported UP-TO-DATE with nothing generated (D-M3-21),
# which leaves Hilt aggregated deps missing. Full processing every run is cheap and deterministic.
ksp.incremental=false
