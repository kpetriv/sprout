name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, static analysis, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      # Validates the wrapper jar checksum and caches Gradle dependencies and build outputs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Everything but the unit tests (`-x test` drops every module's test tasks), so a lint or Detekt failure is told
      # apart from a test or screenshot failure below. `build` runs assembleRelease (R8) and `check` the release checks
      # on its output (checkReleaseMapping, checkReleaseAppCheck, checkMergedManifestForTelemetry), so a release
      # regression shows on every PR. CI builds no Play bundle, so checkReleaseConfiguration (secrets, a v* tag) does
      # not run here; the release workflow runs it.
      - name: Build, Detekt, Lint
        id: static
        run: ./gradlew build detekt lint -x test --no-daemon

      # verifyRoborazziDebug compares the screenshot tests against the goldens in src/test/screenshots with the small
      # tolerance of D-M2-11 and fails on a real diff. It shares the invocation with `test`, so each module's
      # testDebugUnitTest runs once, in verify mode. Runs even when the static checks failed, for complete feedback.
      # TEMPORARY diagnostic for the CI-only Hilt MissingBinding failure: shows which KSP outputs exist on the runner.
      - name: Diagnose KSP outputs
        if: always()
        run: |
          echo "== generated ksp java files per module/variant"
          find . -path '*/build/generated/ksp/*' -name '*.java' -not -path './build-logic/*' | sed -E 's#/build/generated/ksp/([^/]+)/java/.*#  \1#' | sort | uniq -c
          echo "== core/crypto ksp debug tree"
          find core/crypto/build/generated/ksp -maxdepth 3 | sort
          echo "== core/database ksp release tree"
          find core/database/build/generated/ksp -maxdepth 3 | sort
          echo "== kspCaches"
          find core/crypto/build/kspCaches -maxdepth 2 2>/dev/null | sort
          echo "== aggregated deps in library jars"
          for j in $(find . -path '*/build/intermediates/*classes*' -name 'classes.jar' -not -path './build-logic/*' | grep -E 'core/(crypto|database)|feature/lock' | sort); do echo "-- $j"; unzip -l "$j" | grep hilt_aggregated_deps || echo "   (none)"; done

      - name: Unit and screenshot tests
        id: gate
        if: ${{ !cancelled() && (steps.static.outcome == 'success' || steps.static.outcome == 'failure') }}
        run: ./gradlew test verifyRoborazziDebug --no-daemon

      # check:privacy (M8 §1, D-M8-1): the committed privacy and security pages in server/public are what
      # docs/PRIVACY.md and docs/SECURITY.md render to with the example values. Python standard library only.
      - name: Privacy pages up to date
        if: ${{ !cancelled() }}
        run: python3 tools/privacy/check.py

      # checkDataSafetyInventory (M8 §2, D-M8-2): every permission of the merged release manifest and every SDK on the
      # release runtime classpath has an entry in docs/DATA_SAFETY.md, and every entry is still in the build.
      - name: Data-safety inventory
        if: ${{ !cancelled() && (steps.static.outcome == 'success' || steps.static.outcome == 'failure') }}
        run: python3 tools/privacy/inventory.py --check --gradle-arg=--no-daemon

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

      # Expected, actual and side-by-side compare images for every screenshot that changed (docs/SCREENSHOT_TESTS.md).
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-diffs
          path: '**/build/outputs/roborazzi/**'
          if-no-files-found: ignore
          retention-days: 7

      # A golden recorded on macOS can differ from a Linux render by more than the tolerance. When the test step failed
      # (not lint or Detekt), record a full Linux set so it can be reviewed and committed. The `Record screenshots`
      # workflow does the same on demand.
      - name: Record screenshots on Linux
        id: record-screenshots
        if: failure() && steps.gate.outcome == 'failure'
        continue-on-error: true
        run: ./gradlew recordRoborazziDebug --no-daemon

      - name: Upload Linux screenshots
        if: failure() && steps.record-screenshots.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-linux
          path: '**/src/test/screenshots/**'
          if-no-files-found: ignore
          retention-days: 7

  # Firestore rules and server (callables, D-M3-29) tests against the Firebase emulators (docs/FIREBASE.md). Not part
  # of the required check yet (D-M3-11).
  backend:
    name: 'Backend: rules and server tests'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            firestore/package-lock.json

      # The emulators run on the JVM; firebase-tools 15 requires Java 21 or newer.
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Read the pinned firebase-tools version
        id: firebase-tools
        run: echo "version=$(node -p "require('./server/package-lock.json').packages['node_modules/firebase-tools'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache emulator jars
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ steps.firebase-tools.outputs.version }}

      - name: Server (install, lint, build, static pages, test)
        working-directory: server
        run: |
          npm ci
          npm run lint
          npm run build
          npm run check:static
          npm test

      - name: Firestore rules (install, lint, test)
        working-directory: firestore
        run: |
          npm ci
          npm run lint
          npm test

      # npm audit at high severity (SC-4, D-M8-10) with the reviewed exceptions in each package's
      # audit-exceptions.json (server/scripts/audit.mjs, docs/FIREBASE.md "Dependency audit"). After the tests, so a
      # new advisory never hides a test result; it still fails the job.
      - name: Dependency audit (server)
        if: ${{ !cancelled() }}
        working-directory: server
        run: npm run audit

      - name: Dependency audit (firestore)
        if: ${{ !cancelled() }}
        working-directory: firestore
        run: npm run audit
