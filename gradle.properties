# Gradle daemon
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# IDE: do not auto-download Gradle API / dependency sources during sync.
# Those downloads resolve artifacts (gradle src zip, Groovy metadata) that CLI
# builds never touch, so strict dependency verification rejects the sync.
# Sources can still be fetched on demand from the editor.
idea.gradle.download.sources=false
