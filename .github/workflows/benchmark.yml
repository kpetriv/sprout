name: Benchmark

# OPTIONAL and manual only (D-M7-3): runs the Macrobenchmarks (StartupBenchmark, ScrollBenchmark) against the
# `benchmarkRelease` build on a Gradle Managed Device (benchmark/build.gradle.kts, `pixel6Api33`) and uploads the JSON
# results. It is not a required check and does not regenerate the Baseline Profile: profiles are generated on a local
# emulator and committed (README "Performance"). Emulator numbers on a shared runner are noisy; treat them as a smoke
# test of the journeys and a rough trend, not as the README's figures. Run it from the Actions tab or with
# `gh workflow run Benchmark --ref <branch>`.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Macrobenchmark (managed device)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      # The managed emulator needs hardware acceleration on the Linux runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # EMULATOR: Macrobenchmark refuses emulators unless told otherwise.
      - name: Run benchmarks
        run: >-
          ./gradlew :benchmark:pixel6Api33BenchmarkReleaseAndroidTest --no-daemon
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: benchmark/build/outputs/managed_device_android_test_additional_output/**
          if-no-files-found: warn
          retention-days: 14
