# Builds the signed Play bundle for a release tag (M8 §4, D-M8-5). Manual only:
#
#   gh workflow run release.yml -f tag=v1.0.0
#
# Checks out the tag with its full history (versionName from the tag, versionCode from the commit count, D-M8-4),
# writes the upload keystore and google-services.json to the runner only, runs the static gate checks and
# `bundleRelease` (which runs checkReleaseConfiguration, the telemetry manifest check, checkReleaseMapping and
# checkReleaseAppCheck), checks the data-safety inventory, and uploads the AAB and R8's mapping.txt as an artifact.
# Publishing to Play's internal track (as a draft) is optional: it runs only when the PLAY_SERVICE_ACCOUNT_JSON secret
# is set. docs/RELEASE_CHECKLIST.md item 9 lists the secrets and how to set them.
#
# Secrets: SPROUT_UPLOAD_KEYSTORE_BASE64, SPROUT_UPLOAD_KEYSTORE_PASSWORD, SPROUT_UPLOAD_KEY_ALIAS,
# SPROUT_UPLOAD_KEY_PASSWORD, GOOGLE_SERVICES_JSON_B64, SPROUT_FUNCTIONS_BASE_URL, SPROUT_GOOGLE_SERVER_CLIENT_ID,
# SPROUT_PRIVACY_URL, optional SPROUT_SECURITY_URL (default: /security on the privacy page's host) and
# PLAY_SERVICE_ACCOUNT_JSON. Secrets reach only the steps that need them, through `env`, never through `${{ }}` in a
# script, and nothing prints them (GitHub masks them in logs as well).
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed bundle for ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      # "true" or "false" only; the credentials themselves are passed to the publish step alone.
      PLAY_PUBLISHING: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}

    steps:
      - name: Check the tag name
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::The tag must look like v1.2.3 (optionally v1.2.3-rc.1)."
            exit 1
          fi

      # Full history and tags: `git describe` and `git rev-list --count HEAD` give the version (a shallow clone would
      # build versionCode 1).
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check the version
        run: |
          described="$(git describe --tags --match 'v*' --abbrev=0)"
          if [[ "$described" != "$RELEASE_TAG" ]]; then
            echo "::error::git describe gives $described, not $RELEASE_TAG: release the newest v* tag of its commit."
            exit 1
          fi
          echo "Building ${RELEASE_TAG#v} (versionCode $(git rev-list --count HEAD))."

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      # Validates the wrapper jar checksum. Read-only cache: a release build never writes to the shared cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      # Outside the workspace (RUNNER_TEMP), owner-only, removed at the end. google-services.json has to be in app/.
      - name: Write the signing key and Firebase configuration
        env:
          SPROUT_UPLOAD_KEYSTORE_BASE64: ${{ secrets.SPROUT_UPLOAD_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          umask 077
          missing=0
          for name in SPROUT_UPLOAD_KEYSTORE_BASE64 GOOGLE_SERVICES_JSON_B64; do
            if [[ -z "${!name}" ]]; then echo "::error::The $name secret is not set."; missing=1; fi
          done
          [[ "$missing" == 0 ]] || exit 1
          printf '%s' "$SPROUT_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json

      # The static half of the gate (as CI's build job, without the unit tests), then the signed bundle. bundleRelease
      # depends on checkReleaseConfiguration, which fails naming any missing secret's variable or property.
      - name: Static checks and signed bundle
        env:
          SPROUT_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.SPROUT_UPLOAD_KEYSTORE_PASSWORD }}
          SPROUT_UPLOAD_KEY_ALIAS: ${{ secrets.SPROUT_UPLOAD_KEY_ALIAS }}
          SPROUT_UPLOAD_KEY_PASSWORD: ${{ secrets.SPROUT_UPLOAD_KEY_PASSWORD }}
          SPROUT_FUNCTIONS_BASE_URL: ${{ secrets.SPROUT_FUNCTIONS_BASE_URL }}
          SPROUT_GOOGLE_SERVER_CLIENT_ID: ${{ secrets.SPROUT_GOOGLE_SERVER_CLIENT_ID }}
          SPROUT_PRIVACY_URL: ${{ secrets.SPROUT_PRIVACY_URL }}
          SPROUT_SECURITY_URL: ${{ secrets.SPROUT_SECURITY_URL }}
        run: |
          export SPROUT_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.keystore"
          properties=(
            "-Psprout.functionsBaseUrl=$SPROUT_FUNCTIONS_BASE_URL"
            "-Psprout.googleServerClientId=$SPROUT_GOOGLE_SERVER_CLIENT_ID"
            "-Psprout.privacyUrl=$SPROUT_PRIVACY_URL"
          )
          if [[ -n "$SPROUT_SECURITY_URL" ]]; then properties+=("-Psprout.securityUrl=$SPROUT_SECURITY_URL"); fi
          ./gradlew detekt lint checkMergedManifestForTelemetry :app:bundleRelease "${properties[@]}" --no-daemon

      # checkDataSafetyInventory (D-M8-2), as in CI: the shipped permissions and SDKs match docs/DATA_SAFETY.md.
      - name: Data-safety inventory
        run: python3 tools/privacy/inventory.py --check --gradle-arg=--no-daemon

      - name: Upload the bundle and mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sprout-${{ inputs.tag }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

      # Optional (D-M8-5): Gradle Play Publisher uploads the bundle built above to the internal track as a draft; the
      # owner rolls it out in the Play Console. Play takes a new app's first bundle only through the console, so the
      # first release is uploaded by hand from the artifact. Upload mapping.txt in the console with the release.
      - name: Publish to the internal track (draft)
        if: ${{ env.PLAY_PUBLISHING == 'true' }}
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          SPROUT_FUNCTIONS_BASE_URL: ${{ secrets.SPROUT_FUNCTIONS_BASE_URL }}
          SPROUT_GOOGLE_SERVER_CLIENT_ID: ${{ secrets.SPROUT_GOOGLE_SERVER_CLIENT_ID }}
          SPROUT_PRIVACY_URL: ${{ secrets.SPROUT_PRIVACY_URL }}
        run: >-
          ./gradlew :app:publishReleaseBundle --artifact-dir app/build/outputs/bundle/release
          "-Psprout.functionsBaseUrl=$SPROUT_FUNCTIONS_BASE_URL"
          "-Psprout.googleServerClientId=$SPROUT_GOOGLE_SERVER_CLIENT_ID"
          "-Psprout.privacyUrl=$SPROUT_PRIVACY_URL"
          --no-daemon

      - name: Remove the signing key and Firebase configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore" app/google-services.json
